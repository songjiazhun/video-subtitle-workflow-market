
# 字卡类型定义（阶段 3 专用）
#
# 字卡格式固定为：[字卡](word:关键短语 / type:类型名)
# 追加在字幕正文的下一行，不替换、不修改正文。

format: "[字卡](word:{关键短语} / type:{类型名})"

constraints:
  word_min_chars: 6           # 少于 6 字信息量不足
  word_max_chars: 16          # 多于 16 字在画面上放不下
  must_be_subsequence: true   # 关键短语的字必须按序取自本条字幕正文，可删字浓缩，不可增字编造
  min_cards_per_10_cues: 2    # 每 10 条字幕至少 2 张卡
  max_cards_per_cue: 1        # 同一条字幕最多 1 张卡

types:
  - name: 金色重点
    color: "#FFC53D"
    usage: 核心结论、全片最关键的一句话、需要观众记住的定义
    triggers: [重点, 关键, 核心, 总结, 最重要, 记住, 本质, 结论]
    examples:
      - text: 这个架构最核心的思想就是单一数据源
        card: "[字卡](word:核心思想是单一数据源 / type:金色重点)"
    note: 用量最少的一类。整支影片给 1-3 张就够，滥用会让「重点」失去意义。

  - name: 白色提醒
    color: "#FFFFFF"
    usage: 操作建议、经验提示、补充说明、值得注意但不致命的细节
    triggers: [建议, 提醒, 注意, 可以, 记得, 最好, 通常, 推荐]
    examples:
      - text: 建议先备份资料再进行后面的操作
        card: "[字卡](word:建议先备份资料 / type:白色提醒)"
    note: 最通用的类型。判断不清时优先用这个。

  - name: 红色警告
    color: "#FF4D4F"
    usage: 风险、常见错误、踩坑经验、不可逆操作、明确的禁止事项
    triggers: [错误, 风险, 避免, 不要, 千万, 危险, 坑, 失败, 切勿]
    examples:
      - text: 千万不要在生产环境直接跑这个指令
        card: "[字卡](word:不要在生产环境直接跑 / type:红色警告)"
    note: 只用于真实风险。把一般建议标成警告会造成狼来了效应。

  - name: 蓝色列点
    color: "#4096FF"
    usage: 条列项、操作步骤、分类清单、有序流程
    triggers: [第一, 第二, 首先, 接着, 然后, 步骤, 包括, 分为, 三种, 几个]
    examples:
      - text: 第一步是检查系统设定有没有开启权限
        card: "[字卡](word:第一步检查系统设定 / type:蓝色列点)"
    note: 同一组列点要连续标注，标了「第一步」就要把「第二步」「第三步」都标上。

selection_priority:
  # 一条字幕同时命中多个类型时，按此顺序取第一个
  - 红色警告
  - 蓝色列点
  - 金色重点
  - 白色提醒

antipatterns:
  - 给纯过渡句、寒暄、口头禅加卡（「大家好」「我们继续」）
  - 连续多条字幕全部加卡，画面会被字卡淹没
  - 关键短语只是把正文原样复制一遍，没有浓缩
  - 关键短语断在半个词上（「模式匹配工」）
  - 为了凑密度而给信息量低的句子加卡
